# Cloudflare Pages project `minor-incident` (deploy: epics-pipeline/deploy.sh -> `wrangler pages deploy dist`).
# Functions live in functions/ (anonymous play telemetry, docs/tools/telemetry.md). Bindings exist for production
# only: QA (preview) deploys answer /api/t and /api/replay with 503, so test data never mixes with real players.
name = "minor-incident"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-05"

[env.production]

[[env.production.d1_databases]]
binding = "DB"
database_name = "mi-telemetry"
database_id = "5592c62b-468c-498a-b724-fcc6d692ae90"

[[env.production.r2_buckets]]
binding = "REPLAYS"
bucket_name = "mi-replays"

[env.preview]
