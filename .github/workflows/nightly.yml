name: Nightly simulation
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:nightly -- --reporter=default --reporter=json --outputFile=test-results/nightly.json
      - name: Tests leave the checkout clean
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-test-results
          path: test-results/
