<!doctype html><html><head><style>html,body{margin:0;overflow:hidden;background:#ddd}#labels{position:absolute;inset:0;pointer-events:none;font:12px sans-serif;color:#18212d}.label{position:absolute;bottom:12px;transform:translateX(-50%);text-align:center;width:170px}</style></head><body><div id="labels"></div><script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{KTX2Loader}from'three/addons/loaders/KTX2Loader.js';import{MeshoptDecoder}from'three/addons/libs/meshopt_decoder.module.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#d9dbde');scene.add(new T.HemisphereLight(0xffffff,0x777b83,2));const light=new T.DirectionalLight(0xffffff,2.5);light.position.set(4,7,3);scene.add(light);const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:'#d9dbde',roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);const camera=new T.OrthographicCamera(-4.5,4.5,4.5*innerHeight/innerWidth,-4.5*innerHeight/innerWidth,.01,100),loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).setKTX2Loader(new KTX2Loader().setTranscoderPath('/assets/basis/').detectSupport(renderer));let roots=[];
window.__LINEUP__={async show(rows,view){for(const root of roots){root.removeFromParent();root.traverse(n=>{if(n.isMesh){n.geometry.dispose();for(const m of Array.isArray(n.material)?n.material:[n.material]){m.map?.dispose();m.dispose();}}});}roots=[];const dir=view==='side'?new T.Vector3(0,.025,1):new T.Vector3(1,.025,0),right=new T.Vector3(0,1,0).cross(dir).normalize();let high=1.8;
 for(const[row,i]of rows.map((r,i)=>[r,i])){const root=(await loader.loadAsync('/'+row.path.replace(/^public\//,''))).scene;root.traverse(n=>{if(n.name.startsWith('stump_')||n.userData.hidden||/^survivor\d+_root$/.test(n.name)&&row.rootName&&n.name!==row.rootName)n.visible=false;});root.updateMatrixWorld(true);const b=new T.Box3();root.traverseVisible(n=>{if(n.isMesh)b.union(new T.Box3().setFromObject(n));});const height=b.max.y-b.min.y;if(row.deliveredHeight){root.scale.multiplyScalar(row.deliveredHeight/height);root.updateMatrixWorld(true);b.makeEmpty();root.traverseVisible(n=>{if(n.isMesh)b.union(new T.Box3().setFromObject(n));});}const centre=b.getCenter(new T.Vector3()),offset=(i-(rows.length-1)/2)*1.3;root.position.set(right.x*offset-centre.x,-b.min.y,right.z*offset-centre.z);high=Math.max(high,b.max.y-b.min.y);scene.add(root);roots.push(root);}
 const halfHeight=Math.max(high*.5+.25,rows.length*1.3*innerHeight/innerWidth*.53);camera.left=-halfHeight*innerWidth/innerHeight;camera.right=-camera.left;camera.top=halfHeight;camera.bottom=-halfHeight;camera.updateProjectionMatrix();const target=new T.Vector3(0,high*.5,0);camera.position.copy(dir.clone().multiplyScalar(12).add(target));camera.lookAt(target);scene.updateMatrixWorld(true);await renderer.compileAsync(scene,camera);renderer.render(scene,camera);document.getElementById('labels').innerHTML=rows.map((r,i)=>{const p=new T.Vector3(right.x*(i-(rows.length-1)/2)*1.3,0,right.z*(i-(rows.length-1)/2)*1.3).project(camera);return `<div class="label" style="left:${(p.x*.5+.5)*100}%">${r.id}${r.rootName?'<br>'+r.rootName:''}${r.policy==='child'?'<br>q257 child':r.policy==='retained intentional bulk'?'<br>retained bulk':''}</div>`}).join('');await new Promise(done=>requestAnimationFrame(()=>{renderer.render(scene,camera);done()}));return{view,metresToPixels:innerHeight/(2*halfHeight),figures:rows.map(r=>({id:r.id,rootName:r.rootName,deliveredHeight:r.deliveredHeight,path:r.path}))};}};
</script></body></html>
