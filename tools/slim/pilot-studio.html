<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#d9dbde;width:100%;height:100%;overflow:hidden}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{KTX2Loader}from'three/addons/loaders/KTX2Loader.js';import{MeshoptDecoder}from'three/addons/libs/meshopt_decoder.module.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#d9dbde');scene.add(new THREE.HemisphereLight(0xffffff,0x777b83,2));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(4,7,3);scene.add(light);const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#d9dbde',roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const camera=new THREE.OrthographicCamera(-1.45,1.45,1.45*innerHeight/innerWidth,-1.45*innerHeight/innerWidth,.01,100);const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).setKTX2Loader(new KTX2Loader().setTranscoderPath('/assets/basis/').detectSupport(renderer));
async function load(url){const root=(await loader.loadAsync(url)).scene;root.traverse(n=>{if(n.name.startsWith('stump_')||n.userData.hidden)n.visible=false;if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});root.updateMatrixWorld(true);const body=root.getObjectByName('skin_body')??root.getObjectByName('courierSkin')??root;let bounds=new THREE.Box3().setFromObject(body);if(!url.includes('courier-female')){root.scale.multiplyScalar((url.includes('woman-a')?1.454:1.454*1.08)/(bounds.max.y-bounds.min.y));root.updateMatrixWorld(true);bounds=new THREE.Box3().setFromObject(body);}root.position.y-=bounds.min.y;return root;}
const root='/docs/reports/slim/pilot/input/';const ready=Promise.all([load('/assets/models/char.courier-female.skin.glb'),load(root+'npc.civilian-man-a.model.q249.skin.glb'),load('/assets/models/slim-pilot/npc.civilian-man-a.lod0.glb'),load(root+'npc.civilian-woman-a.model.skin.glb'),load('/assets/models/slim-pilot/npc.civilian-woman-a.lod0.glb')]);
window.__SLIM__={ready,async show(figure,state,view){const[h,mb,ma,wb,wa]=await ready;for(const x of[h,mb,ma,wb,wa])x.removeFromParent();const pair=figure==='man-a'?[mb,ma]:[wb,wa],ped=state==='before'?pair[0]:pair[1];scene.add(h,ped);const dir=view==='front'?new THREE.Vector3(1,.06,0):view==='side'?new THREE.Vector3(0,.06,1):new THREE.Vector3(1,.16,1).normalize(),right=new THREE.Vector3(0,1,0).cross(dir).normalize();for(const[r,s]of[[h,-1],[ped,1]]){r.position.x=right.x*.61*s;r.position.z=right.z*.61*s;}camera.position.copy(dir.multiplyScalar(6)).add(new THREE.Vector3(0,.92,0));camera.lookAt(0,.92,0);scene.updateMatrixWorld(true);await renderer.compileAsync(scene,camera);renderer.render(scene,camera);await new Promise(r=>requestAnimationFrame(()=>{renderer.render(scene,camera);r()}));return{figure,state,view,scale:'same actual metres'};}};
</script></body></html>
