<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#d9dbde;width:100%;height:100%;overflow:hidden}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {KTX2Loader} from 'three/addons/loaders/KTX2Loader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#d9dbde');scene.add(new THREE.HemisphereLight(0xffffff,0x777b83,2));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(4,7,3);light.castShadow=true;light.shadow.mapSize.set(2048,2048);light.shadow.camera.left=-4;light.shadow.camera.right=4;light.shadow.camera.top=4;light.shadow.camera.bottom=-4;light.shadow.bias=-.0002;scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#d9dbde',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const camera=new THREE.OrthographicCamera(-1.45,1.45,1.45*innerHeight/innerWidth,-1.45*innerHeight/innerWidth,.01,100);
const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).setKTX2Loader(new KTX2Loader().setTranscoderPath('/assets/basis/').detectSupport(renderer));
async function load(url){const root=(await loader.loadAsync(url)).scene;root.traverse(n=>{if(n.name.startsWith('stump_')||n.userData.hidden)n.visible=false;if(n.isMesh){n.castShadow=true;n.receiveShadow=true;if(url.includes('npc.civilian-man-a')){for(const material of Array.isArray(n.material)?n.material:[n.material]){if(!material.map)continue;material.onBeforeCompile=shader=>{shader.uniforms.pilotBlue={value:new THREE.Color('#3178ac')};shader.fragmentShader='uniform vec3 pilotBlue;\n'+shader.fragmentShader;shader.fragmentShader=shader.fragmentShader.replace('#include <map_fragment>',`#include <map_fragment>
#ifdef USE_MAP
float region=floor(texture2D(map,vMapUv).a*7.0+.5)-1.0;
if(abs(region-2.0)<.1){float shade=clamp(dot(diffuseColor.rgb,vec3(.2126,.7152,.0722))/.24,.5,1.7);diffuseColor.rgb=pilotBlue*shade;}
#endif`);};}}}});root.updateMatrixWorld(true);const body=root.getObjectByName('skin_body')??root.getObjectByName('courierSkin')??root;const bounds=new THREE.Box3().setFromObject(body);root.position.y-=bounds.min.y;return root;}
const ready=Promise.all([load('/assets/models/char.courier-female.skin.glb'),load('/docs/reports/q249/'+(new URLSearchParams(location.search).get('report')??'pilot-2')+'/input/npc.civilian-man-a.before.glb'),load('/assets/models/q249-pilot/npc.civilian-man-a.lod0.glb')]);
window.__PILOT__={ready,async show(phase,view){const [heroine,before,after]=await ready;before.removeFromParent();after.removeFromParent();heroine.removeFromParent();const ped=phase==='before'?before:after;scene.add(heroine,ped);const direction=view==='front'?new THREE.Vector3(1,0,0):view==='side'?new THREE.Vector3(0,0,1):new THREE.Vector3(1,.3,1).normalize();const right=new THREE.Vector3(0,1,0).cross(direction).normalize();for(const [root,side] of [[heroine,-1],[ped,1]]){root.position.x=right.x*.61*side;root.position.z=right.z*.61*side;}camera.position.copy(direction.multiplyScalar(6)).add(new THREE.Vector3(0,.95,0));camera.lookAt(0,.95,0);scene.updateMatrixWorld(true);await renderer.compileAsync(scene,camera);renderer.render(scene,camera);await new Promise(r=>requestAnimationFrame(()=>{renderer.render(scene,camera);r()}));return {phase,view,unitsPerMetre:1};}};
</script></body></html>
